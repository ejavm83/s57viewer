# Render Blueprint: https://render.com/docs/blueprint-spec
# Free tier: no persistent disk — use bundled sample + browser upload API.
# For full ENC on server disk, use plan: starter and add the disk block (see README).
services:
  - type: web
    name: s57viewer
    runtime: docker
    plan: free
    healthCheckPath: /api/categories
    envVars:
      - key: CACHE_DIR
        value: /tmp/cache
      - key: DEFAULT_SAMPLE_DIR
        value: /app/sample_data/korea-regional
      - key: PYTHONUNBUFFERED
        value: "1"
