# Render Blueprint: https://render.com/docs/blueprint-spec
# Free tier: no persistent disk — use bundled sample + browser upload API.
# For full ENC on server disk, use plan: starter and add the disk block (see README).
services:
  - type: web
    name: s57viewer
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CACHE_DIR
        value: /app/cache
      - key: DEFAULT_SAMPLE_DIR
        value: /app/sample_data/korea-regional
      - key: SKIP_STARTUP_CHART_LOAD
        value: "1"
      # Optional: index every .000 under DEFAULT_SAMPLE_DIR (slower / more memory)
      # - key: DEFAULT_SAMPLE_INDEX_BOUNDS
      #   value: "all"
      - key: PYTHONUNBUFFERED
        value: "1"
